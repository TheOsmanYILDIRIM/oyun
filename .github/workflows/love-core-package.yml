name: Build current core-plasma LOVE archive
on:
  push:
    branches: [experiment/core-love-package-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  love-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm exact core game source
        run: |
          test "$(git rev-parse HEAD:game/love)" = "$(git rev-parse 388452c964c40c50e81fb42d58f8e100de4dcc85:game/love)"
          test -s game/love/main.lua
          test -s game/love/player/core_visual.lua
          test -s game/love/player/core_aura.lua
      - name: Package standalone .love and verify SHA256
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from hashlib import sha256
          root=Path('game/love')
          files=sorted(p for p in root.rglob('*') if p.is_file() and 'tests' not in p.relative_to(root).parts and p.suffix=='.lua')
          assert len(files)>=35, f'Only {len(files)} game Lua files'
          out=Path('dist/oyun-core-plasma-20261016.love')
          out.parent.mkdir(exist_ok=True)
          with ZipFile(out,'w',ZIP_DEFLATED,compresslevel=9) as z:
              for f in files:z.write(f,f.relative_to(root).as_posix())
          with ZipFile(out) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              required={'main.lua','conf.lua','player/core_visual.lua','player/core_aura.lua','objects/renderer.lua','systems/inventory.lua','systems/crafting.lua','systems/building.lua','world/liquids.lua'}
              assert required<=names,required-names
              assert not any(n.startswith('tests/') or n.startswith('game/love/') for n in names)
          (out.parent/'SHA256SUMS.txt').write_text(sha256(out.read_bytes()).hexdigest()+'  '+out.name+'\n')
          print('CORE_LOVE_ARCHIVE_OK',out.stat().st_size,sha256(out.read_bytes()).hexdigest(),len(files))
          PY
      - name: Install LOVE and Xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq love xvfb
      - name: Execute exact packaged archive in real LOVE
        env:
          OSMAN_LOVE_STAGE5_RUNTIME_SMOKE: '1'
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s xvfb-run -a love dist/oyun-core-plasma-20261016.love 2>&1 | tee /tmp/core-love-package.log
          grep -q LOVE_STAGE5_RUNTIME_SMOKE_OK /tmp/core-love-package.log
      - uses: actions/upload-artifact@v4
        with:
          name: oyun-core-plasma-love-download
          path: |
            dist/oyun-core-plasma-20261016.love
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
