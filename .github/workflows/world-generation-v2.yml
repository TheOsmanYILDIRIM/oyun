name: LOVE world generation v2

on:
  push:
    branches:
      - experiment/world-generation-v2
    paths:
      - 'game/love/world/**'
      - 'game/love/tests/world_stage2.lua'
      - '.github/workflows/world-generation-v2.yml'
      - 'docs/14_WORLDQUERY_STAGE2.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  procedural-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4 and LOVE runtime
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4 love xvfb
      - name: Lua syntax and previous baseline tests
        run: |
          find game/love -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
          cd game/love
          lua5.4 tests/run.lua
          lua5.4 tests/runtime.lua
      - name: Seed / biome / Marching Squares seam / chunk tests
        working-directory: game/love
        run: lua5.4 tests/world_stage2.lua
      - name: LOVE stage-two real renderer smoke
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          cp -a game/love/. "$root/"
          cp "$root/world/demo_main.lua" "$root/main.lua"
          OSMAN_LOVE_WORLD_SMOKE=1 timeout 35s xvfb-run -a -s '-screen 0 1280x1440x24' love "$root" 2>&1 | tee /tmp/world-stage2-smoke.log
          grep -q 'LOVE_WORLD_SMOKE_OK' /tmp/world-stage2-smoke.log
