name: LOVE biome core validation
on:
  push:
    branches: [experiment/world-2d-design-20261012]
    paths:
      - 'game/love/**'
      - 'docs/13_LOVE_2D_RUNTIME_STAGE1.md'
      - '.github/workflows/love-biome-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  biome-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Syntax check all Lua modules
        run: find game/love -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Execute biome unit tests
        working-directory: game/love
        run: lua5.4 tests/run.lua
      - name: Execute input and camera unit tests
        working-directory: game/love
        run: lua5.4 tests/runtime.lua
